[build]
  command = "npm run build"
  publish = "dist"

# Proxy all /api/* requests from Netlify (HTTPS) to the Railway backend (HTTPS)
[[redirects]]
  from = "/api/*"
  to = "https://course-hosting-node-ver-production.up.railway.app/:splat"
  status = 200
  force = true

# Optional: proxy /files so static lesson PDFs also work through Netlify
[[redirects]]
  from = "/files/*"
  to = "https://course-hosting-node-ver-production.up.railway.app/files/:splat"
  status = 200
  force = true

# SPA fallback: send all other routes to index.html so React Router can handle them
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200